name: build_and_test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        # all from ubuntu 24.04 archive, newer clang versions are in clang_new_version.yaml
        compiler: [g++-12, g++-13, g++-14, clang++-14, clang++-15, clang++-16, clang++-17]
        cpp_standard: [20]
        build_type: [Debug, Release]
    runs-on: ${{matrix.os}}

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        env:
          COMPILER: ${{matrix.compiler}}
        run: |
          if [[ "$COMPILER" == g++-* ]]; then
            packages="$COMPILER"
          elif [[ "$COMPILER" == clang++-* ]]; then
            version="${COMPILER#clang++-}"
            # libclang-rt contains sanitizers runtime (ASAN build)
            packages="clang-$version libclang-rt-$version-dev"
          else
            echo "unknown compiler $COMPILER"
            exit 1
          fi
          sudo apt-get update
          sudo apt-get install -y ninja-build $packages

      - name: Configure CMake
        run: |
          cmake . -DKELCORO_ENABLE_TESTING=ON             \
            -DCMAKE_BUILD_TYPE=${{matrix.build_type}}     \
            -DCMAKE_CXX_COMPILER=${{matrix.compiler}}     \
            -DCMAKE_CXX_STANDARD=${{matrix.cpp_standard}} \
            -B build -G "Ninja"

      - name: Build
        run: cmake --build build

      - name: Test
        run: |
          cd build
          ctest --output-on-failure -C ${{matrix.build_type}} -V

      - name: Configure CMake (ASAN)
        run: |
          cmake . -DKELCORO_ENABLE_TESTING=ON             \
            -DCMAKE_BUILD_TYPE=${{matrix.build_type}}     \
            -DCMAKE_CXX_COMPILER=${{matrix.compiler}}     \
            -DCMAKE_CXX_STANDARD=${{matrix.cpp_standard}} \
            -DKELCORO_ENABLE_ASAN=ON                      \
            -B build_asan -G "Ninja"

      - name: Build (ASAN)
        run: cmake --build build_asan

      - name: Test (ASAN)
        run: |
          cd build_asan
          ctest --output-on-failure -C ${{matrix.build_type}} -V
